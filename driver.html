<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RIDE7 Driver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./driver.css" />
  </head>
  <body>
    <main class="driver-app">
      <section class="driver-map">
        <img src="./assets/ride7-phone-map.png" alt="Mapa do motorista RIDE7 Driver" />
        <div class="google-map-canvas" id="driverGoogleMap" aria-label="Google Maps do motorista"></div>
        <header class="driver-header">
          <button class="round-button" type="button" aria-label="Menu" data-menu-trigger>Menu</button>
          <div class="driver-brand" aria-label="RIDE7 Driver">
            <img src="./assets/ride7-logo-app.png" alt="" />
            <strong>DRIVER</strong>
          </div>
          <div class="driver-header-actions">
            <div class="language-dropdown app-language-dropdown" data-language-switcher aria-label="Escolher idioma">
              <button class="language-trigger" type="button" data-language-trigger aria-label="Alterar idioma">
                <span class="flag flag-br" data-current-flag></span>
              </button>
              <div class="language-menu">
                <button type="button" data-lang="pt-BR" aria-label="Português Brasil"><span class="flag flag-br"></span><span>BR</span></button>
                <button type="button" data-lang="pt-PT" aria-label="Português Portugal"><span class="flag flag-pt"></span><span>PT</span></button>
                <button type="button" data-lang="en" aria-label="English"><span class="flag flag-us"></span><span>EN</span></button>
                <button type="button" data-lang="es" aria-label="Español"><span class="flag flag-es"></span><span>ES</span></button>
              </div>
            </div>
            <button class="round-button" type="button" aria-label="Ajuda">SOS</button>
          </div>
        </header>

        <div class="driver-status" id="driverStatus">
          <span></span>
          <strong>Cadastro pendente</strong>
        </div>
      </section>

      <section class="driver-sheet" id="driverSheet">
        <div class="sheet-handle"></div>
        <div class="loading-state">Carregando RIDE7 Driver...</div>
      </section>

      <div class="menu-backdrop" data-menu-close hidden></div>
      <aside class="app-menu" data-app-menu aria-hidden="true" hidden>
        <div class="app-menu-head">
          <span>
            <img src="./assets/ride7-logo-app.png" alt="" />
            <strong>RIDE7 DRIVER</strong>
          </span>
          <button type="button" data-menu-close aria-label="Fechar menu">Fechar</button>
        </div>
        <div class="menu-profile">
          <span class="menu-avatar" data-driver-avatar>PB</span>
          <span>Motorista parceiro</span>
          <strong>Pablo Bueno Braga</strong>
          <small>Toyota Corolla - R7D4A21</small>
        </div>
        <nav class="menu-list" aria-label="Menu do motorista">
          <button type="button" data-menu-action="dashboard">Painel</button>
          <button type="button" data-menu-action="profile">Perfil e dados</button>
          <button type="button" data-menu-action="online">Ficar online/offline</button>
          <button type="button" data-menu-action="monetization">Monetizacao</button>
          <button type="button" data-menu-action="documents">Conta e documentos</button>
          <button type="button" data-menu-action="support">Suporte Driver</button>
        </nav>
        <div class="menu-footer">
          <button type="button" data-menu-action="landing">Pagina inicial</button>
          <button type="button" data-menu-action="logout">Sair</button>
        </div>
      </aside>
    </main>

    <script src="./maps-config.js"></script>
    <script src="./ride7-maps.js"></script>
    <script src="./language-switcher.js"></script>
    <script src="./driver.js"></script>
  </body>
</html>
