<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RIDE7 - App do Cliente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./cliente.css" />
  </head>
  <body>
    <main class="client-app">
      <section class="client-map">
        <img src="./assets/ride7-phone-map.png" alt="Mapa com origem, destino e veiculos proximos" />
        <div class="google-map-canvas" id="clientGoogleMap" aria-label="Google Maps do cliente"></div>
        <header class="client-header">
          <button class="round-button" type="button" aria-label="Menu">Menu</button>
          <img src="./assets/ride7-logo-app.png" alt="RIDE7" />
          <div class="client-header-actions">
            <div class="language-dropdown app-language-dropdown" data-language-switcher aria-label="Escolher idioma">
              <button class="language-trigger" type="button" data-language-trigger aria-label="Alterar idioma">
                <span class="flag flag-br" data-current-flag></span>
              </button>
              <div class="language-menu">
                <button type="button" data-lang="pt-BR" aria-label="Português Brasil"><span class="flag flag-br"></span><span>BR</span></button>
                <button type="button" data-lang="pt-PT" aria-label="Português Portugal"><span class="flag flag-pt"></span><span>PT</span></button>
                <button type="button" data-lang="en" aria-label="English"><span class="flag flag-us"></span><span>EN</span></button>
                <button type="button" data-lang="es" aria-label="Español"><span class="flag flag-es"></span><span>ES</span></button>
              </div>
            </div>
            <button class="round-button" type="button" aria-label="Seguranca">SOS</button>
          </div>
        </header>
        <div class="client-status" id="clientStatus">
          <span></span>
          <strong>3 veiculos cadastrados perto de voce</strong>
        </div>
        <div class="pickup-marker" id="pickupMarker">
          <span>Local de partida</span>
        </div>
      </section>

      <section class="client-sheet" id="clientSheet">
        <div class="sheet-handle"></div>
        <div class="loading-state">Carregando RIDE7...</div>
      </section>
    </main>

    <script src="./maps-config.js"></script>
    <script src="./ride7-maps.js"></script>
    <script src="./language-switcher.js"></script>
    <script src="./cliente.js"></script>
  </body>
</html>
